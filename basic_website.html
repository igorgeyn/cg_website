<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nori's Nibbles Order Form</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet"/>
  <style>body { font-family: 'Montserrat', sans-serif; }</style>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">
  <div class="bg-white p-8 rounded-xl shadow-lg max-w-md w-full">
    <h1 class="text-2xl font-semibold text-green-900 mb-6 text-center">Order Your Cat Grass</h1>
    <form id="orderForm" method="POST" class="space-y-4">
      <div>
        <label for="name" class="block font-medium">Name</label>
        <input type="text" id="name" name="name" required
               class="w-full border border-green-300 rounded p-2 focus:outline-none focus:ring-2 focus:ring-green-400"/>
      </div>
      <div>
        <label for="email" class="block font-medium">Email</label>
        <input type="email" id="email" name="email" required
               class="w-full border border-green-300 rounded p-2 focus:outline-none focus:ring-2 focus:ring-green-400"/>
      </div>
      <div>
        <label for="quantity" class="block font-medium">Quantity (pots)</label>
        <input type="number" id="quantity" name="quantity" min="1" required
               class="w-full border border-green-300 rounded p-2 focus:outline-none focus:ring-2 focus:ring-green-400"/>
      </div>
      <div>
        <label for="address" class="block font-medium">Shipping Address</label>
        <textarea id="address" name="address" rows="3" required
                  class="w-full border border-green-300 rounded p-2 focus:outline-none focus:ring-2 focus:ring-green-400"></textarea>
      </div>
      <button type="submit"
              class="w-full bg-green-500 hover:bg-green-400 text-white font-semibold py-3 rounded transition">
        Submit Order
      </button>
    </form>
    <p class="mt-4 text-sm text-gray-500 text-center">
      Thanks for supporting our small, family-run cat grass farm!
    </p>
  </div>
</body>
</html>
