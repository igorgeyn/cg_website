<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nori's Nibbles Blog</title>
  
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-YDHQ4QD341"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-YDHQ4QD341');
  </script>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet"/>
  <!-- Markdown renderer -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    html { scroll-behavior: smooth; }
    body { font-family: 'Montserrat', sans-serif; }
  </style>
</head>
<body class="bg-white text-gray-800">

  <!-- Mobile-Optimized Header -->
  <header class="sticky top-0 z-50 bg-green-800 bg-opacity-90 backdrop-blur-md py-3 shadow">
    <div class="container mx-auto px-4">
      <!-- Mobile: Stack title and nav -->
      <div class="block md:hidden">
        <h1 class="text-lg font-bold text-white text-center mb-2">Nori's Nibbles</h1>
        <nav class="overflow-x-auto">
          <ul class="flex space-x-3 text-xs font-medium whitespace-nowrap">
            <li><a href="index.html#hero" class="text-white hover:text-green-200">Home</a></li>
            <li><a href="index.html#about" class="text-white hover:text-green-200">About</a></li>
            <li><a href="pricing.html" class="text-white hover:text-green-200">Pricing</a></li>
            <li><a href="index.html#features" class="text-white hover:text-green-200">Benefits</a></li>
            <li><a href="index.html#gallery" class="text-white hover:text-green-200">Gallery</a></li>
            <li><a href="index.html#order" class="text-white hover:text-green-200">Order</a></li>
            <li><a href="blog.html" class="text-white hover:text-green-200 underline">Blog</a></li>
          </ul>
        </nav>
      </div>
      
      <!-- Desktop: Side by side -->
      <div class="hidden md:flex items-center justify-between">
        <h1 class="text-2xl font-bold text-white">Nori's Nibbles</h1>
        <nav>
          <ul class="flex space-x-4 text-sm font-medium">
            <li><a href="index.html#hero" class="text-white hover:text-green-200">Home</a></li>
            <li><a href="index.html#about" class="text-white hover:text-green-200">About</a></li>
            <li><a href="pricing.html" class="text-white hover:text-green-200">Pricing</a></li>
            <li><a href="index.html#features" class="text-white hover:text-green-200">Benefits</a></li>
            <li><a href="index.html#gallery" class="text-white hover:text-green-200">Gallery</a></li>
            <li><a href="index.html#order" class="text-white hover:text-green-200">Order</a></li>
            <li><a href="blog.html" class="text-white hover:text-green-200 underline">Blog</a></li>
          </ul>
        </nav>
      </div>
    </div>
  </header>
  
  <!-- Main Content -->
  <main class="pt-8 md:pt-20 container mx-auto px-4 md:px-6 py-8 md:py-12">
    <!-- Blog List -->
    <div id="post-list" class="space-y-6 md:space-y-8 text-center text-gray-600">
      <div class="mb-6 md:mb-8">
        <h1 class="text-2xl md:text-3xl font-bold text-green-800 mb-2">Nori's Nibbles Blog</h1>
        <p class="text-gray-600">Tips, stories, and updates about cat grass and feline wellness.</p>
      </div>
      <div class="loading-message">Loading posts…</div>
    </div>
    
    <!-- Individual Post Content -->
    <article id="post-content" class="prose prose-lg max-w-none mx-auto" style="display:none;">
      <!-- Blog post content will be loaded here -->
    </article>
    
    <!-- Back to Blog Link (only shown when viewing individual post) -->
    <div id="back-to-blog" class="mt-8 text-center" style="display:none;">
      <a href="blog.html" class="inline-block bg-green-500 hover:bg-green-400 text-white font-semibold py-2 px-6 rounded transition">
        ← Back to Blog
      </a>
    </div>
  </main>

  <script>
    // pick the correct marked function
    const renderMarkdown = (typeof marked === 'function')
      ? marked
      : (typeof marked.parse === 'function' ? marked.parse : null);

    function getQueryParam(name) {
      return new URLSearchParams(window.location.search).get(name);
    }

    async function loadIndex() {
      const res = await fetch('blog/index.json');
      if (!res.ok) throw new Error(`index.json load failed: ${res.status}`);
      return res.json();
    }

    async function loadMarkdown(filename) {
      const res = await fetch(`blog/${filename}`);
      if (!res.ok) throw new Error(`Failed to fetch ${filename}: ${res.status}`);
      return res.text();
    }

    (async () => {
      const listEl      = document.getElementById('post-list');
      const contentEl   = document.getElementById('post-content');
      const backLinkEl  = document.getElementById('back-to-blog');
      const post        = getQueryParam('post');

      if (post) {
        // Single-post flow
        try {
          const md = await loadMarkdown(post);
          listEl.style.display     = 'none';
          backLinkEl.style.display = 'block';
          if (!renderMarkdown) throw new Error('No Markdown renderer found');
          contentEl.innerHTML      = renderMarkdown(md);
          contentEl.style.display  = 'block';
          
          // Update page title if we can extract title from markdown
          const titleMatch = md.match(/^#\s+(.+)$/m);
          if (titleMatch) {
            document.title = `${titleMatch[1]} - Nori's Nibbles Blog`;
          }
        } catch (err) {
          console.error('Error loading post:', err);
          listEl.style.display = 'block';
          listEl.innerHTML     = `
            <div class="mb-6 md:mb-8">
              <h1 class="text-2xl md:text-3xl font-bold text-green-800 mb-2">Nori's Nibbles Blog</h1>
              <p class="text-gray-600">Tips, stories, and updates about cat grass and feline wellness.</p>
            </div>
            <p class="text-red-600">Error loading this post. Please try again later.</p>
          `;
        }
      } else {
        // Index-list flow
        try {
          const index = await loadIndex();
          const loadingMsg = listEl.querySelector('.loading-message');
          if (loadingMsg) loadingMsg.remove();
          
          if (!index.length) {
            const noPostsDiv = document.createElement('div');
            noPostsDiv.innerHTML = '<p>No blog posts found yet. Check back soon for cat grass tips and stories!</p>';
            listEl.appendChild(noPostsDiv);
          } else {
            const postsContainer = document.createElement('div');
            postsContainer.className = 'space-y-6 max-w-2xl mx-auto';
            
            index.forEach(({ filename, title, date }) => {
              const div = document.createElement('div');
              div.className = 'bg-white border border-gray-200 rounded-lg p-6 shadow-sm hover:shadow-md transition';
              div.innerHTML = `
                <a href="?post=${filename}" class="block group">
                  <h2 class="text-xl font-semibold text-green-700 group-hover:text-green-600 mb-2">
                    ${title}
                  </h2>
                  <p class="text-gray-500 text-sm">${date}</p>
                  <p class="text-green-600 text-sm mt-2 group-hover:underline">Read more →</p>
                </a>
              `;
              postsContainer.appendChild(div);
            });
            
            listEl.appendChild(postsContainer);
          }
        } catch (err) {
          console.error('Error loading blog index:', err);
          const loadingMsg = listEl.querySelector('.loading-message');
          if (loadingMsg) loadingMsg.remove();
          
          const errorDiv = document.createElement('div');
          errorDiv.innerHTML = '<p class="text-red-600">Error loading blog. Please try again later.</p>';
          listEl.appendChild(errorDiv);
        }
      }
    })();
  </script>

</body>
</html>
