<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nori's Nibbles Blog</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet"/>
  <!-- Markdown renderer -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    html { scroll-behavior: smooth; }
    body { font-family: 'Montserrat', sans-serif; }
  </style>
</head>
<body class="bg-white text-gray-800">

  <!-- Header -->
  <header class="sticky top-0 z-50 bg-green-800 bg-opacity-90 backdrop-blur-md py-4 shadow">
    <div class="container mx-auto px-6 flex items-center justify-between">
      <h1 class="text-2xl font-bold text-white">Nori’s Nibbles</h1>
      <nav>
        <ul class="flex space-x-4 text-sm font-medium">
          <li><a href="one-page-template.html#hero" class="text-white hover:text-green-200 transition">Home</a></li>
          <li><a href="one-page-template.html#about" class="text-white hover:text-green-200 transition">About</a></li>
          <li><a href="one-page-template.html#features" class="text-white hover:text-green-200 transition">Benefits</a></li>
          <li><a href="one-page-template.html#gallery" class="text-white hover:text-green-200 transition">Gallery</a></li>
          <li><a href="one-page-template.html#order" class="text-white hover:text-green-200 transition">Order</a></li>
          <li><a href="blog.html" class="text-white hover:text-green-200 transition underline">Blog</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main class="pt-20 container mx-auto px-6 py-12">
    <div id="post-list" class="space-y-8 text-center text-gray-600">
      Loading posts…
    </div>
    <article id="post-content" class="prose max-w-none mx-auto" style="display:none;"></article>
  </main>

  <script>
    // pick the correct marked function
    const renderMarkdown = (typeof marked === 'function')
      ? marked
      : (typeof marked.parse === 'function' ? marked.parse : null);

    function getQueryParam(name) {
      return new URLSearchParams(window.location.search).get(name);
    }

    async function loadIndex() {
      const res = await fetch('blog/index.json');
      if (!res.ok) throw new Error(`index.json load failed: ${res.status}`);
      return res.json();
    }

    async function loadMarkdown(filename) {
      const res = await fetch(`blog/${filename}`);
      if (!res.ok) throw new Error(`Failed to fetch ${filename}: ${res.status}`);
      return res.text();
    }

    (async () => {
      const listEl    = document.getElementById('post-list');
      const contentEl = document.getElementById('post-content');
      const post      = getQueryParam('post');

      if (post) {
        // Single-post flow
        try {
          const md = await loadMarkdown(post);
          listEl.style.display   = 'none';
          if (!renderMarkdown) throw new Error('No Markdown renderer found');
          contentEl.innerHTML     = renderMarkdown(md);
          contentEl.style.display = 'block';
        } catch (err) {
          console.error('Error loading post:', err);
          listEl.style.display = 'block';
          listEl.innerHTML     = '<p class="text-red-600">Error loading this post. Please try again later.</p>';
        }
      } else {
        // Index-list flow
        try {
          const index = await loadIndex();
          listEl.innerHTML = '';
          if (!index.length) {
            listEl.innerHTML = '<p>No blog posts found.</p>';
          } else {
            index.forEach(({ filename, title, date }) => {
              const div = document.createElement('div');
              div.className = 'border-b pb-4';
              div.innerHTML = `
                <a href="?post=${filename}" class="text-xl font-semibold text-green-700 hover:underline">
                  ${title}
                </a>
                <p class="text-gray-500 text-sm">${date}</p>
              `;
              listEl.appendChild(div);
            });
          }
        } catch (err) {
          console.error('Error loading blog index:', err);
          listEl.innerHTML = '<p class="text-red-600">Error loading blog. Please try again later.</p>';
        }
      }
    })();
  </script>

</body>
</html>
