<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nori's Nibbles Gallery</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet"/>
  <style>body { font-family: 'Montserrat', sans-serif; }</style>
</head>
<body class="bg-white">
  <div class="max-w-5xl mx-auto py-12 px-4">
    <h2 class="text-3xl font-semibold text-center text-green-900 mb-8">Our Cats in Action</h2>
    <div class="grid gap-6 grid-cols-2 sm:grid-cols-3 lg:grid-cols-4">
      <!-- Replace these src values with your own image paths -->
      <div class="overflow-hidden rounded-lg shadow-lg">
        <img src="cat-grass-5.jpg" alt="Cat nibbling grass"
             class="w-full h-48 object-cover transform hover:scale-105 transition"/>
      </div>
      <div class="overflow-hidden rounded-lg shadow-lg">
        <img src="cat-grass-6.jpg" alt="Fresh pots"
             class="w-full h-48 object-cover transform hover:scale-105 transition"/>
      </div>
      <div class="overflow-hidden rounded-lg shadow-lg">
        <img src="cat-grass-7.jpg" alt="Kitty happy"
             class="w-full h-48 object-cover transform hover:scale-105 transition"/>
      </div>
      <div class="overflow-hidden rounded-lg shadow-lg">
        <img src="cat-grass-8.jpg" alt="Green wheatgrass"
             class="w-full h-48 object-cover transform hover:scale-105 transition"/>
      </div>
      <!-- add more as needed -->
    </div>
  </div>
</body>
</html>
