<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="robots" content="noindex,nofollow"/>
  <title>Nori's Nibbles · Email preferences</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet"/>
  <style>
    body{background:#fbf8ec;color:#193126;font-family:Montserrat,sans-serif;margin:0;padding:1rem}.card{background:#fff;border:1px solid rgba(18,63,43,.16);border-radius:1.2rem;box-shadow:0 1rem 3rem rgba(18,63,43,.09);margin:14vh auto;max-width:30rem;padding:2rem;text-align:center}h1{color:#123f2b;font-size:1.65rem}p{color:#617067;line-height:1.6}a{color:#27764c;font-weight:700}
  </style>
</head>
<body>
  <main class="card">
    <div aria-hidden="true" style="font-size:2.5rem">🌱</div>
    <h1>Email preferences</h1>
    <p id="unsubscribe-message">Updating your batch-alert preference…</p>
    <p><a href="index.html">Return to Nori's Nibbles</a></p>
  </main>
  <script src="order-config.js"></script>
  <script>
    (async () => {
      const message = document.getElementById('unsubscribe-message');
      const token = new URLSearchParams(location.search).get('token');
      const base = window.NORIS_NIBBLES_CONFIG?.apiBaseUrl;
      if (!token || !base) { message.textContent = 'This unsubscribe link is incomplete or email services are not configured.'; return; }
      try {
        const response = await fetch(`${base.replace(/\/$/, '')}/unsubscribe-updates`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token }) });
        if (!response.ok) throw new Error();
        message.textContent = 'You have been unsubscribed from optional batch-alert emails. Essential messages for any active order are unaffected.';
      } catch { message.textContent = 'We could not update that preference. Please contact us and we’ll take care of it.'; }
    })();
  </script>
</body>
</html>
